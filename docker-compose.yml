# GreptimeDB + grepui in playground mode: grepui waits for the database, seeds demo traces and
# logs into the `demo` database (only when it is empty), keeps a trickle of live demo traffic
# going, and serves on :8080. For a real deployment use `serve` (the image default) instead.
services:
  greptimedb:
    image: greptime/greptimedb:v1.3.0
    command: >
      standalone start --http-addr 0.0.0.0:4000 --rpc-bind-addr 0.0.0.0:4001
      --mysql-addr 0.0.0.0:4002 --postgres-addr 0.0.0.0:4003
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["greptime-data:/greptimedb_data"]

  grepui:
    image: ${GREPUI_IMAGE:-ghcr.io/teochenglim/grepui:latest}
    build: .
    command: ["playground", "--wait", "90", "--demo-data", "--admin-writes"]
    environment:
      GREPTIME_MYSQL: mysql://root@greptimedb:4002/demo
      # Where the playground writes demo data (compose-internal).
      GREPTIME_HTTP: http://greptimedb:4000
      # The address collectors on the host use; shown on the Connect page.
      GREPTIME_HTTP_PUBLIC: http://127.0.0.1:4000
      # Where grepui calls GreptimeDB's pipeline API (compose-internal).
      GREPUI_PIPELINE_HTTP: http://greptimedb:4000
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [greptimedb]

volumes:
  greptime-data:
